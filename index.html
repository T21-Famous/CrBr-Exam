function home(){view='home';resetPending=false;round=null;const total=saved.sessions.reduce((n,v,s)=>n+counts(BANK[s],v.answers).done,0);screen.innerHTML=`<section class="q-home-lead"><h1>5 ชุด · ฝึกให้แยกออก</h1><p class="q-muted">ครบทั้ง 8 บททุกชุด · ขอบเขตและสัดส่วนเท่ากัน · เปลี่ยนสถานการณ์และมุมถามระหว่างชุด</p><div class="q-row"><span class="q-tag">675 ข้อทั้งหมด</span><span class="q-tag">ทำแล้ว ${total} / 675</span><span class="q-tag">เฉลยทันทีหลังตอบ</span></div></section><section class="q-sets" aria-label="เลือกชุดข้อสอบ">${BANK.map((qs,s)=>{const c=counts(qs,saved.sessions[s].answers);return `<article class="q-panel q-set"><span class="q-tag" style="align-self:flex-start">ชุด ${s+1}</span><h2>125 ช้อยส์ + 10 ถูก–ผิด</h2><p class="q-muted q-small">Preparation · Impression · Cementation<br>Provisional · Shade · Die/Wax/Casting · Bridge</p><div class="q-small">ทำแล้ว ${c.done}/${qs.length} · ถูก ${c.good}</div><button class="q-primary" type="button" data-action="start" data-set="${s}">${c.done===qs.length?'ทบทวนชุดนี้':c.done?'ทำต่อ':'เริ่มทำ'}</button></article>`;}).join('')}</section><details class="q-panel"><summary>สัดส่วนหัวข้อและการใช้งาน</summary><p style="margin-top:12px">ช้อยส์ทุกชุด: เตรียมฟัน 30 · tissue/impression 25 · try-in/cementation 20 · provisional 15 · สีฟัน 10 · die/wax 8 · investing/casting 7 · crown/bridge 10</p><p>เลือกทำข้ามข้อหรือย้อนกลับได้ เมื่อเลือกคำตอบแล้วจะล็อกคะแนนและแสดงเหตุผลทุกตัวเลือก ใช้คำใบ้ก่อนตอบได้ หลังครบชุดให้ทำรอบเฉพาะข้อผิดโดยคะแนนรอบแรกยังอยู่</p><p class="q-muted q-small">แต่ละชุดครอบคลุมครบ 8 บทและมีสัดส่วนเดียวกัน; บางข้อทดสอบหลักร่วมกันผ่านคนละสถานการณ์ ข้อสอบยึดบทสรุปในไฟล์ที่แนบ รวมค่าที่ระบุเฉพาะ guide นั้น; ไม่ใช้ D8/D16 และอุณหภูมิ burnout ที่เอกสารระบุว่าขัดกันเป็นคำตอบตายตัว เปิดไฟล์ที่ดาวน์โหลดใน browser หรือ HTML viewer ได้โดยไม่ใช้เน็ต</p></details>`;}
function questionView(){view='quiz';resetPending=false;const qs=questions(),st=state();st.index=Math.max(0,Math.min(qs.length-1,st.index));const q=qs[st.index],ans=st.answers[q.id],answered=Object.hasOwn(st.answers,q.id),c=counts(qs,st.answers);const label=i=>q.type==='tf'?(i===0?'ถูก':'ผิด'):'ABCD'[i];const isLast=st.index===qs.length-1;
screen.innerHTML=`<div class="q-layout"><section class="q-panel"><div class="q-meta"><span class="q-tag">ชุด ${selected+1}${round?' · รอบแก้ข้อผิด':''}</span><span class="q-small">ข้อ ${st.index+1} / ${qs.length} · ถูก ${c.good} / ${qs.length}</span></div><progress value="${c.done}" max="${qs.length}" aria-label="ทำแล้ว ${c.done} จาก ${qs.length} ข้อ"></progress><div class="q-muted q-small">${q.type==='tf'?'ถูก–ผิด':'ช้อยส์ 4 ตัวเลือก'} · ${escape(q.topic)}${round?' · ข้อเดิม '+q.number:''}</div><h2 style="margin-top:10px" id="q-question">${escape(q.question)}</h2><div class="q-options" aria-labelledby="q-question">${q.choices.map((o,i)=>`<button type="button" class="q-option ${answered&&i===q.correct?'q-right':answered&&i===ans?'q-wrong':''}" data-action="answer" data-option="${i}" ${answered?'disabled':''}><span class="q-letter">${q.type==='tf'?(i===0?'○':'×'):'ABCD'[i]}</span><span>${escape(o)}${answered&&i===q.correct?' <strong>✓ คำตอบถูก</strong>':''}${answered&&i===ans&&i!==q.correct?' <strong>✕ ที่เลือก</strong>':''}</span></button>`).join('')}</div>${!answered?`<details class="q-hint"><summary>คำใบ้</summary><div>${escape(q.hint)}</div></details><p class="q-muted q-small">กดเลือกเพื่อส่งคำตอบและดูเฉลยทันที · เปลี่ยนคำตอบเพิ่มคะแนนไม่ได้</p>`:`<section class="q-feedback" aria-live="polite"><h3 class="${ans===q.correct?'q-good-text':'q-bad-text'}">${ans===q.correct?'✓ ถูกต้อง':'✕ ยังไม่ถูก'} · คำตอบ ${escape(label(q.correct))}</h3>${q.type==='tf'?`<p>${escape(q.explanations[q.correct])}</p>`:q.choices.map((o,i)=>`<div class="q-exp ${i===q.correct?'q-correct-exp':''}"><div><strong>${'ABCD'[i]}. ${i===q.correct?'ถูก':'ผิด'} — ${escape(o)}</strong></div><div>${escape(q.explanations[i])}</div></div>`).join('')}<div class="q-source">แหล่งทบทวน: CrBr(1).zip → ${escape(q.source)} → ${escape(q.section)}</div></section>`}<div class="q-row q-nav-actions"><button type="button" data-action="prev" ${st.index===0?'disabled':''}>← ก่อนหน้า</button><button type="button" class="q-primary" data-action="${isLast?'result':'next'}">${isLast?'ดูคะแนนรวม':'ข้อถัดไป →'}</button></div></section><aside class="q-panel"><h3>ไปยังข้อ</h3><p class="q-muted q-small">ทำแล้ว ${c.done} / ${qs.length} · เลือกข้ามได้</p><details><summary>เลขข้อทั้งหมด · เลือกข้ามข้อ</summary><div class="q-navgrid">${qs.map((v,i)=>{const done=Object.hasOwn(st.answers,v.id),good=st.answers[v.id]===v.correct;return `<button type="button" data-action="jump" data-index="${i}" class="${done?(good?'q-done-good':'q-done-bad'):''}" aria-current="${i===st.index?'true':'false'}" aria-label="ข้อ ${i+1} ${done?(good?'ตอบถูก':'ตอบผิด'):'ยังไม่ตอบ'}">${i+1}${done?(good?' ✓':' ✕'):''}</button>`;}).join('')}</div></details><p class="q-small q-muted">✓ ถูก · ✕ ผิด · ไม่มีสัญลักษณ์ = ยังไม่ตอบ</p><div class="q-row"><button type="button" data-action="unanswered">ข้อที่ยังไม่ตอบ</button><button type="button" data-action="result">ดูคะแนน</button></div>${round?'<p class="q-small q-muted" style="margin-top:12px">รอบนี้ไม่เปลี่ยนคะแนนรอบแรก</p><button type="button" data-action="original">กลับชุดหลัก</button>':''}</aside></div>`;persist();}
function resultView(){view='result';const qs=questions(),st=state(),c=counts(qs,st.answers),wrong=qs.filter(q=>Object.hasOwn(st.answers,q.id)&&st.answers[q.id]!==q.correct),complete=c.done===qs.length;const pct=Math.round(c.good/qs.length*100);const topics={};qs.forEach(q=>{topics[q.topic]??={total:0,done:0,good:0};topics[q.topic].total++;if(Object.hasOwn(st.answers,q.id))topics[q.topic].done++;if(st.answers[q.id]===q.correct)topics[q.topic].good++;});const feedback=pct>=80?'เข้าใจเนื้อหาได้ดีมาก':pct>=60?'พื้นฐานดี แต่ควรทบทวนบางหัวข้อ':'ควรทบทวนเนื้อหาหลักก่อนลองใหม่';screen.innerHTML=`<section class="q-panel q-summary"><div class="q-tag">ชุด ${selected+1}${round?' · รอบแก้ข้อผิด':''}</div><h1 style="margin-top:16px">${complete?'ผลการทำข้อสอบ':'คะแนนระหว่างทำ'}</h1><div class="q-stat">${c.good} / ${qs.length}</div><p>${complete?pct+'% · '+feedback:'ทำแล้ว '+c.done+' ข้อ · เหลือ '+(qs.length-c.done)+' ข้อ'}</p><div class="q-row"><span class="q-tag">ถูก ${c.good}</span><span class="q-tag">ผิด ${wrong.length}</span><span class="q-tag">ยังไม่ตอบ ${qs.length-c.done}</span></div><hr class="q-divider"><h3>ผลแยกหัวข้อ</h3>${Object.entries(topics).map(([t,v])=>`<div class="q-topicrow"><span>${escape(t)}</span><span class="q-small">ถูก ${v.good}/${v.total} · ทำแล้ว ${v.done}</span></div>`).join('')}${wrong.length?`<h3 style="margin-top:20px">หัวข้อที่ควรทบทวน</h3><p>${escape([...new Set(wrong.map(q=>q.topic))].join(' · '))}</p><p class="q-muted q-small">ข้อผิด: ${wrong.map(q=>q.number).join(', ')} · เฉลยดูได้จากข้อที่ตอบแล้วเท่านั้น</p>`:''}<div class="q-row" style="margin-top:22px"><button type="button" class="q-primary" data-action="resume">${complete?'กลับไปทบทวน':'ทำต่อ'}</button>${complete&&wrong.length?'<button type="button" data-action="retry">ทำเฉพาะข้อผิด</button>':''}${!complete?'<button type="button" data-action="unanswered">ไปข้อที่ยังไม่ตอบ</button>':''}${round?'<button type="button" data-action="original">กลับชุดหลัก</button>':'<button type="button" class="q-reset" data-action="reset-ask">เริ่มชุดนี้ใหม่</button>'}<button type="button" data-action="home">เลือกชุดอื่น</button></div><div id="q-confirm-reset"></div>${!complete?'<p class="q-muted q-small" style="margin-top:14px">ยังไม่ประเมินเปอร์เซ็นต์ความเข้าใจจนกว่าจะทำครบชุด</p>':''}</section>`;}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled||!root.contains(b))return;const a=b.dataset.action;if(a==='theme'){saved.theme=saved.theme==='light'?'dark':'light';setTheme();persist();return;}if(a==='home'){home();return;}if(a==='start'){selected=Number(b.dataset.set);round=null;questionView();return;}if(a==='answer'&&view==='quiz'){const st=state(),q=questions()[st.index];if(!Object.hasOwn(st.answers,q.id)){const i=Number(b.dataset.option);if(Number.isInteger(i)&&i>=0&&i<q.choices.length){st.answers[q.id]=i;persist();questionView();}}return;}if(a==='prev'||a==='next'||a==='jump'){const st=state();st.index=a==='jump'?Number(b.dataset.index):st.index+(a==='next'?1:-1);questionView();return;}if(a==='result'){resultView();return;}if(a==='resume'){questionView();return;}if(a==='unanswered'){const qs=questions(),st=state();const i=qs.findIndex(q=>!Object.hasOwn(st.answers,q.id));if(i>=0){st.index=i;questionView();}else resultView();return;}if(a==='retry'){const qs=questions(),st=state();if(counts(qs,st.answers).done!==qs.length)return;const wrong=qs.filter(q=>st.answers[q.id]!==q.correct);if(wrong.length){round={questions:wrong,answers:{},index:0};questionView();}return;}if(a==='original'){round=null;questionView();return;}if(a==='reset-ask'){resetPending=true;screen.querySelector('#q-confirm-reset').innerHTML='<div class="q-hint"><p>ล้างคำตอบและคะแนนของชุดนี้เพื่อเริ่มใหม่?</p><div class="q-row"><button type="button" data-action="reset-confirm">ล้างและเริ่มใหม่</button><button type="button" data-action="reset-cancel">ยกเลิก</button></div></div>';return;}if(a==='reset-cancel'){resetPending=false;screen.querySelector('#q-confirm-reset').innerHTML='';return;}if(a==='reset-confirm'&&resetPending){saved.sessions[selected]={answers:{},index:0};round=null;resetPending=false;persist();questionView();}});
setTheme();home();
})();
</script>
</div>
